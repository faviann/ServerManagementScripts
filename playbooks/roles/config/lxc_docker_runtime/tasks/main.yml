---
# Main tasks file for lxc_docker_runtime role
# Installs Docker using geerlingguy.docker role.
# Managed account creation and Docker group membership are owned by
# config/lxc_docker_environment so UID/GID are enforced in one place.

- name: Install Docker
  ansible.builtin.import_tasks: install_docker.yml

- name: Ensure Docker service is started and enabled
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Verify Docker installation
  ansible.builtin.command:
    cmd: docker --version
  register: _docker_version
  changed_when: false
  check_mode: false

- name: Display Docker version
  ansible.builtin.debug:
    msg: "Docker installed: {{ _docker_version.stdout }}"

- name: Verify Docker Compose installation
  ansible.builtin.command:
    cmd: docker compose version
  register: _docker_compose_version
  changed_when: false
  check_mode: false

- name: Display Docker Compose version
  ansible.builtin.debug:
    msg: "Docker Compose installed: {{ _docker_compose_version.stdout }}"
