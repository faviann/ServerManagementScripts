---
# Default variables for lxc_docker_runtime role

# ==============================================================================
# Docker Installation Configuration
# ==============================================================================
# Docker installation (uses geerlingguy.docker role)
lxc_docker_runtime_install_compose_plugin: true
lxc_docker_runtime_compose_package: docker-compose-plugin
lxc_docker_runtime_compose_package_state: present

# Docker daemon options. geerlingguy.docker writes this mapping to
# /etc/docker/daemon.json verbatim, so Ansible must declare the complete file
# in one pass — including the NVIDIA runtime on GPU hosts. Anything left to a
# second writer (nvidia-ctk) makes both writers rewrite the file and restart
# Docker on every apply.
#
# The runtimes block is a byte-for-byte restatement of what
# `nvidia-ctk runtime configure --runtime=docker` emitted with NVIDIA Container
# Toolkit 1.19.1. A newer toolkit may expect a different shape; re-verify the
# block against the toolkit's own output when it is upgraded.
lxc_docker_runtime_daemon_options: >-
  {{
    {
      'log-driver': 'json-file',
      'log-opts': {'max-size': '10m', 'max-file': '3'},
    }
    | combine(
      {'runtimes': {'nvidia': {'args': [], 'path': 'nvidia-container-runtime'}}}
      if (gpu_enabled | default(false) | bool) else {}
    )
  }}
