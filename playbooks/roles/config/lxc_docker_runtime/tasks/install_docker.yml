---
# Docker installation entrypoint. Kept as its own tasks file so the daemon
# options this role hands to geerlingguy.docker can be observed on their own
# (tests/regression/test_lxc_docker_runtime_daemon_options.py includes this
# file via tasks_from) without also running the service and verification tasks
# in main.yml against the machine running the test.

- name: Install Docker using geerlingguy.docker role
  ansible.builtin.include_role:
    name: geerlingguy.docker
  vars:
    docker_install_compose_plugin: "{{ lxc_docker_runtime_install_compose_plugin }}"
    docker_compose_package: "{{ lxc_docker_runtime_compose_package }}"
    docker_compose_package_state: "{{ lxc_docker_runtime_compose_package_state }}"
    docker_daemon_options: "{{ lxc_docker_runtime_daemon_options }}"
