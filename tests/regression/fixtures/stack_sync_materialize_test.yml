---
- name: Test materialize rejects a prereq path that is not a directory
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    lxc_docker_environment_internal:
      shared_mount_source: "{{ temp_root }}/wrong-type/shared"
      stacks_source: "{{ temp_root }}/wrong-type/stacks-source"
      shared_owner: "{{ ansible_user_uid }}"
      shared_group: "{{ ansible_user_gid }}"
      docker_uid: 12345
      docker_gid: 12346
      path_ownership_overrides: []
    wrong_type_prereq_path: >-
      {{ lxc_docker_environment_internal.shared_mount_source }}/stacks/komf/data/uploads
    wrong_type_target_stack_file: >-
      {{ lxc_docker_environment_internal.shared_mount_source }}/stacks/komf/compose.yaml
  tasks:
    - name: Create wrong-type prereq fixture layout
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ lxc_docker_environment_internal.stacks_source }}/komf"
        - "{{ lxc_docker_environment_internal.shared_mount_source }}/stacks/komf/data"
      check_mode: false

    - name: Seed a regular file at the declared prereq directory path
      ansible.builtin.copy:
        content: "not-a-directory"
        dest: "{{ wrong_type_prereq_path }}"
        mode: "0644"
      check_mode: false

    - name: Create compose file declaring the wrong-type prereq path
      ansible.builtin.copy:
        content: |
          services: {}
          x-prereq-dirs:
            - ./data/uploads
        dest: "{{ lxc_docker_environment_internal.stacks_source }}/komf/compose.yaml"
        mode: "0644"
      check_mode: false

    - name: Run actual find ops for wrong-type prereq fixture
      ansible.builtin.find:
        paths: "{{ lxc_docker_environment_internal.stacks_source }}"
        patterns: "*.j2"
        hidden: true
        recurse: true
        file_type: file
      register: _per_host_j2_files
      delegate_to: localhost
      become: false

    - name: Find static stack files for wrong-type prereq fixture
      ansible.builtin.find:
        paths: "{{ lxc_docker_environment_internal.stacks_source }}"
        patterns: "*"
        excludes: "*.j2,.gitkeep"
        hidden: true
        recurse: true
        file_type: file
      register: _per_host_static_files
      delegate_to: localhost
      become: false

    - name: Find stack directories for wrong-type prereq fixture
      ansible.builtin.find:
        paths: "{{ lxc_docker_environment_internal.stacks_source }}"
        recurse: true
        file_type: directory
      register: _per_host_dirs
      delegate_to: localhost
      become: false

    - name: Verify materialize fails closed for a wrong-type prereq path
      block:
        - name: Include materialize for wrong-type prereq fixture
          ansible.builtin.include_tasks:
            file: "../../../playbooks/roles/config/lxc_stack_sync/tasks/materialize.yml"
            apply:
              become: true

        - name: Fail when materialize accepts a wrong-type prereq path
          ansible.builtin.fail:
            msg: "Materialize accepted a regular file as a prerequisite directory"
      rescue:
        - name: Inspect target stack file after wrong-type rejection
          ansible.builtin.stat:
            path: "{{ wrong_type_target_stack_file }}"
          register: _wrong_type_target_stack_file_stat

        - name: Verify wrong-type prereq failure is actionable
          ansible.builtin.assert:
            that:
              - wrong_type_prereq_path in wrong_type_failure_messages
              - "'not a directory' in wrong_type_failure_messages"
              - not _wrong_type_target_stack_file_stat.stat.exists
          vars:
            wrong_type_failure_messages: >-
              {{ ansible_failed_result.results | default([])
                 | map(attribute='msg') | join(' ') }}

- name: Test materialize renders templates and copies static files
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    lxc_docker_environment_internal:
      shared_mount_source: "{{ temp_root }}/shared"
      stacks_source: "{{ temp_root }}/stacks-source"
      shared_owner: "{{ ansible_user_uid }}"
      shared_group: "{{ ansible_user_gid }}"
      docker_uid: 12345
      docker_gid: 12346
      path_ownership_overrides:
        - path: "{{ temp_root }}/shared/stacks/komf/data/cache"
          owner: "{{ ansible_user_uid }}"
          group: "{{ ansible_user_gid }}"
          recurse: false
    lxc_docker_env_stack_vars:
      komf:
        komga_user: "komf-user"
        komga_password: "komf-pa$$"
  tasks:
    - name: Create source stack layout
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ lxc_docker_environment_internal.stacks_source }}/komf"
        - "{{ lxc_docker_environment_internal.shared_mount_source }}/stacks"
        - "{{ lxc_docker_environment_internal.shared_mount_source }}/stacks/komf/data"
      check_mode: false

    - name: Seed an existing prereq directory with divergent metadata
      ansible.builtin.file:
        path: "{{ lxc_docker_environment_internal.shared_mount_source }}/stacks/komf/data/uploads"
        state: directory
        owner: "{{ ansible_user_uid }}"
        group: "{{ ansible_user_gid }}"
        mode: "0700"
      check_mode: false

    - name: Create a templated Komf compose file (.j2)
      ansible.builtin.copy:
        content: |
          # stack: {{ '{{' }} stack_name {{ '}}' }}
          # komga user: {{ '{{' }} stack_vars.komga_user {{ '}}' }}
          services:
            komf:
              image: "example.invalid/komf-{{ '{{' }} stack_vars.komga_user {{ '}}' }}:latest"
          x-prereq-dirs:
            - ./data/uploads
            - ./data/downloads
            - ./data/cache
        dest: "{{ lxc_docker_environment_internal.stacks_source }}/komf/compose.yaml.j2"
        mode: "0644"
      check_mode: false

    - name: Create a templated Komf .env.j2
      ansible.builtin.copy:
        content: |
          KOMF_KOMGA_BASE_URI=https://komga.example.invalid
          KOMF_KOMGA_USER={{ '{{' }} stack_vars.komga_user {{ '}}' }}
          KOMF_KOMGA_PASSWORD={{ '{{' }} stack_vars.komga_password | compose_env {{ '}}' }}
          STACK_NAME={{ '{{' }} stack_name {{ '}}' }}
        dest: "{{ lxc_docker_environment_internal.stacks_source }}/komf/.env.j2"
        mode: "0644"
      check_mode: false

    - name: Create a static config file
      ansible.builtin.copy:
        content: "static-config-content"
        dest: "{{ lxc_docker_environment_internal.stacks_source }}/komf/config.conf"
        mode: "0644"
      check_mode: false

    - name: Run actual find ops to populate discover registers
      ansible.builtin.find:
        paths: "{{ lxc_docker_environment_internal.stacks_source }}"
        patterns: "*.j2"
        hidden: true
        recurse: true
        file_type: file
      register: _per_host_j2_files
      delegate_to: localhost
      become: false

    - name: Find static stack files
      ansible.builtin.find:
        paths: "{{ lxc_docker_environment_internal.stacks_source }}"
        patterns: "*"
        excludes: "*.j2,.gitkeep"
        hidden: true
        recurse: true
        file_type: file
      register: _per_host_static_files
      delegate_to: localhost
      become: false

    - name: Find stack directories
      ansible.builtin.find:
        paths: "{{ lxc_docker_environment_internal.stacks_source }}"
        recurse: true
        file_type: directory
      register: _per_host_dirs
      delegate_to: localhost
      become: false

    - name: Include materialize
      ansible.builtin.include_tasks:
        file: "../../../playbooks/roles/config/lxc_stack_sync/tasks/materialize.yml"
        apply:
          become: true

    - name: Inspect prereq directory metadata after materialization
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ lxc_docker_environment_internal.shared_mount_source }}/stacks/komf/data/uploads"
        - "{{ lxc_docker_environment_internal.shared_mount_source }}/stacks/komf/data/downloads"
      register: _prereq_dir_stats_after

    - name: Verify existing prereq metadata is preserved
      ansible.builtin.assert:
        that:
          - _prereq_dir_stats_after.results[0].stat.mode == '0700'
          - _prereq_dir_stats_after.results[0].stat.uid == ansible_user_uid
          - _prereq_dir_stats_after.results[0].stat.gid == ansible_user_gid
          - >-
            (lxc_docker_environment_internal.shared_mount_source ~ '/stacks/komf/data/uploads')
            not in (_lxc_docker_env_reconciliation.materialized.created_dirs | default([]))
          - >-
            (lxc_docker_environment_internal.shared_mount_source ~ '/stacks/komf/data/uploads')
            not in (_lxc_docker_env_reconciliation.materialized.updated_dirs | default([]))

    - name: Verify missing prereq creation behavior
      ansible.builtin.assert:
        that:
          - >-
            ansible_check_mode
            or _prereq_dir_stats_after.results[1].stat.exists
          - >-
            ansible_check_mode
            or _prereq_dir_stats_after.results[1].stat.mode == '0755'
          - >-
            ansible_check_mode
            or _prereq_dir_stats_after.results[1].stat.uid == 12345
          - >-
            ansible_check_mode
            or _prereq_dir_stats_after.results[1].stat.gid == 12346
          - >-
            (lxc_docker_environment_internal.shared_mount_source ~ '/stacks/komf/data/downloads')
            in (_lxc_docker_env_reconciliation.materialized.created_dirs | default([]))
          - >-
            (lxc_docker_environment_internal.shared_mount_source ~ '/stacks/komf/data/downloads')
            not in (_lxc_docker_env_reconciliation.materialized.updated_dirs | default([]))
          - >-
            (_lxc_docker_env_reconciliation.materialized.changed_results | default([])
            | selectattr('path', 'defined')
            | selectattr('path', 'equalto', lxc_docker_environment_internal.shared_mount_source ~ '/stacks/komf/data/uploads')
            | list
            | length) == 0
          - >-
            (_lxc_docker_env_reconciliation.materialized.changed_results | default([])
            | selectattr('path', 'defined')
            | selectattr('path', 'equalto', lxc_docker_environment_internal.shared_mount_source ~ '/stacks/komf/data/downloads')
            | selectattr('changed', 'defined')
            | selectattr('changed')
            | list
            | length) == 1

    - name: Finish after check-mode prereq verification
      ansible.builtin.meta: end_play
      when: ansible_check_mode

    - name: Assert templated files were rendered at target paths
      ansible.builtin.stat:
        path: "{{ item }}"
      register: _rendered_file_stats
      loop:
        - "{{ lxc_docker_environment_internal.shared_mount_source }}/stacks/komf/compose.yaml"
        - "{{ lxc_docker_environment_internal.shared_mount_source }}/stacks/komf/.env"

    - name: Verify templated files exist
      ansible.builtin.assert:
        that:
          - _rendered_file_stats.results | map(attribute='stat.exists') | select('equalto', true) | list | length == 2
        fail_msg: "Rendered Komf compose.yaml and .env were not both created"

    - name: Read rendered Komf compose file
      ansible.builtin.slurp:
        src: "{{ lxc_docker_environment_internal.shared_mount_source }}/stacks/komf/compose.yaml"
      register: _rendered_compose

    - name: Read rendered Komf env file
      ansible.builtin.slurp:
        src: "{{ lxc_docker_environment_internal.shared_mount_source }}/stacks/komf/.env"
      register: _rendered_env

    - name: Assert rendered content contains stack_name and stack_vars substitutions
      ansible.builtin.assert:
        that:
          - "'# stack: komf' in (_rendered_compose.content | b64decode)"
          - "'# komga user: komf-user' in (_rendered_compose.content | b64decode)"
          - "'KOMF_KOMGA_USER=komf-user' in (_rendered_env.content | b64decode)"
          - "'KOMF_KOMGA_PASSWORD=komf-pa$$$$' in (_rendered_env.content | b64decode)"
          - "'STACK_NAME=komf' in (_rendered_env.content | b64decode)"
        fail_msg: "stack_name or stack_vars were not substituted in rendered output"

    - name: Assert static config file was copied
      ansible.builtin.stat:
        path: "{{ lxc_docker_environment_internal.shared_mount_source }}/stacks/komf/config.conf"
      register: _static_file_stat

    - name: Assert static config file exists at target
      ansible.builtin.assert:
        that:
          - _static_file_stat.stat.exists
        fail_msg: "Static config.conf not found at target path"

    - name: Assert .j2 source files were NOT copied as static files
      ansible.builtin.stat:
        path: "{{ item }}"
      register: _j2_source_stats
      loop:
        - "{{ lxc_docker_environment_internal.shared_mount_source }}/stacks/komf/compose.yaml.j2"
        - "{{ lxc_docker_environment_internal.shared_mount_source }}/stacks/komf/.env.j2"

    - name: Assert no .j2 sources exist at target
      ansible.builtin.assert:
        that:
          - _j2_source_stats.results | map(attribute='stat.exists') | select('equalto', true) | list | length == 0
        fail_msg: ".j2 source files should not appear at target"

    - name: Assert planner output captures stack assets and prereq dirs
      ansible.builtin.assert:
        that:
          - "'komf/compose.yaml' in (lxc_stack_sync_manifest_plan.templated_outputs | default([]))"
          - "'komf/.env' in (lxc_stack_sync_manifest_plan.templated_outputs | default([]))"
          - "'example.invalid/komf-komf-user:latest' in (lxc_stack_sync_manifest_plan.source_compose_specs | first).content"
          - lxc_stack_sync_manifest_plan.stack_dirs_to_create | length > 0
          - lxc_stack_sync_manifest_plan.files_to_render | length == 2
          - lxc_stack_sync_manifest_plan.files_to_copy | length == 1
          - "(lxc_docker_environment_internal.shared_mount_source ~ '/stacks/komf/data/uploads')
            not in (lxc_stack_sync_manifest_plan.prereq_dirs | map(attribute='path') | list)"
          - "(lxc_docker_environment_internal.shared_mount_source ~ '/stacks/komf/data/downloads')
            in (lxc_stack_sync_manifest_plan.prereq_dirs | map(attribute='path') | list)"
          - "(lxc_docker_environment_internal.shared_mount_source ~ '/stacks/komf/data/cache')
            not in (lxc_stack_sync_manifest_plan.prereq_dirs | map(attribute='path') | list)"
          - lxc_stack_sync_manifest_plan.ownership_overrides | length == 1
        fail_msg: "Planner output did not capture the expected stack assets and prereq dirs"
