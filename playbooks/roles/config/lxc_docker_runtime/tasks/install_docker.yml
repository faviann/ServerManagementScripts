---
# Docker installation tasks imported by main.yml. The daemon-options regression
# enters through the role's public entrypoint and stubs the external systemd and
# Docker process boundaries so later service and verification tasks cannot touch
# the workstation.

- name: Install Docker using geerlingguy.docker role
  ansible.builtin.include_role:
    name: geerlingguy.docker
  vars:
    docker_install_compose_plugin: "{{ lxc_docker_runtime_install_compose_plugin }}"
    docker_compose_package: "{{ lxc_docker_runtime_compose_package }}"
    docker_compose_package_state: "{{ lxc_docker_runtime_compose_package_state }}"
    docker_daemon_options: "{{ lxc_docker_runtime_daemon_options }}"
