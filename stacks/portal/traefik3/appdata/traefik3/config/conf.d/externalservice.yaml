---
http:
  routers:

# --- SPECIFIC ROUTERS ---

    traefik:
      rule: "Host(`traefik.local.faviann.com`)"
      entryPoints: websecure
      service: api@internal
      priority: 1000
      middlewares:
        - local-ip-restriction

    proxmox:
      rule: "Host(`proxmox.local.faviann.com`)"
      entryPoints: websecure
      service: proxmoxve
      priority: 1000
      middlewares:
        - sslheader
        - local-ip-restriction

    aoe:
      rule: "Host(`aoe.local.faviann.com`)"
      entryPoints: websecure
      service: aoe-workstation
      priority: 1000
      middlewares:
        - local-ip-restriction

    hermes:
      rule: "Host(`hermes.local.faviann.com`)"
      entryPoints: websecure
      service: hermes-dashboard
      priority: 1000
      middlewares:
        - local-ip-restriction

    collie-auth-recovery:
      rule: "Host(`collie.admin.faviann.com`) && PathPrefix(`/auth/`)"
      entryPoints: websecure
      service: authentik
      priority: 1002
      middlewares:
        - local-ip-restriction
        - collie-auth-recovery

    collie:
      rule: "Host(`collie.admin.faviann.com`)"
      entryPoints: websecure
      service: collie-workstation
      priority: 1000
      middlewares:
        - local-ip-restriction
        - protected-edge-auth@file

    authentik-outpost-ai:
      rule: "Host(`ai.local.faviann.com`) && PathPrefix(`/outpost.goauthentik.io`)"
      entryPoints: websecure
      service: authentik
      priority: 1001
      middlewares:
        - sslheader

    ai:
      rule: "Host(`ai.local.faviann.com`)"
      entryPoints: websecure
      service: openclaw-dashboard
      priority: 1000
      middlewares:
        - local-ip-restriction
        - protected-edge-auth@file
        - openclaw-operator-scopes

    # Authentik itself stays edge-open at Traefik so it can handle its own login
    # and callback flows without being wrapped by Traefik forwardAuth.
    authentik:
      rule: "Host(`auth.faviann.com`)"
      entryPoints: websecure
      service: authentik
      priority: 1000
      middlewares:
        - sslheader

    # Authentik outpost callback routers for the protected tiers that still use
    # edge forwardAuth. Public hosts do not use outpost callbacks by default.
    authentik-outpost-root:
      rule: "Host(`faviann.com`) && PathPrefix(`/outpost.goauthentik.io`)"
      entryPoints: websecure
      service: authentik
      priority: 1001
      middlewares:
        - sslheader

    authentik-outpost-admin:
      rule: "Host(`admin.faviann.com`) && PathPrefix(`/outpost.goauthentik.io`)"
      entryPoints: websecure
      service: authentik
      priority: 1001
      middlewares:
        - sslheader

    authentik-outpost-admin-subdomains:
      rule: "HostRegexp(`^[a-z0-9-]+\\.admin\\.faviann\\.com$`) && PathPrefix(`/outpost.goauthentik.io`)"
      entryPoints: websecure
      service: authentik
      priority: 1001
      middlewares:
        - sslheader

    authentik-outpost-home:
      rule: "Host(`home.faviann.com`) && PathPrefix(`/outpost.goauthentik.io`)"
      entryPoints: websecure
      service: authentik
      priority: 1001
      middlewares:
        - sslheader

    authentik-outpost-home-subdomains:
      rule: "HostRegexp(`^[a-z0-9-]+\\.home\\.faviann\\.com$`) && PathPrefix(`/outpost.goauthentik.io`)"
      entryPoints: websecure
      service: authentik
      priority: 1001
      middlewares:
        - sslheader

    authentik-outpost-media:
      rule: "Host(`media.faviann.com`) && PathPrefix(`/outpost.goauthentik.io`)"
      entryPoints: websecure
      service: authentik
      priority: 1001
      middlewares:
        - sslheader

    authentik-outpost-media-subdomains:
      rule: "HostRegexp(`^[a-z0-9-]+\\.media\\.faviann\\.com$`) && PathPrefix(`/outpost.goauthentik.io`)"
      entryPoints: websecure
      service: authentik
      priority: 1001
      middlewares:
        - sslheader

  services:
    proxmoxve:
      loadBalancer:
        servers:
          - url: "https://proxmox.lan:8006"
    aoe-workstation:
      loadBalancer:
        servers:
          - url: "http://workstation.faviann.vms:4001"
    hermes-dashboard:
      loadBalancer:
        servers:
          - url: "http://workstation.faviann.vms:9119"
    collie-workstation:
      loadBalancer:
        servers:
          - url: "http://workstation.faviann.vms:8788"
    openclaw-dashboard:
      loadBalancer:
        servers:
          - url: "http://workstation.faviann.vms:18789"
    authentik:
      loadBalancer:
        servers:
          - url: "http://auth.faviann.vms:9000"
    noop:
      loadBalancer:
        servers: []

  middlewares:
    sslheader:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: "https"
    openclaw-operator-scopes:
      headers:
        customRequestHeaders:
          X-OpenClaw-Scopes: "operator.read,operator.write,operator.admin"
    collie-auth-recovery:
      redirectRegex:
        regex: "^https://collie\\.admin\\.faviann\\.com/auth/.*$"
        replacement: "https://collie.admin.faviann.com/outpost.goauthentik.io/start?rd=https%3A%2F%2Fcollie.admin.faviann.com%2F"
        permanent: false
    local-ip-restriction:
      IPAllowList:
        sourceRange:
          - "127.0.0.1/32"
          - "10.1.0.1/18"
          - "10.0.0.1/24"
          - "10.200.196.0/24"
