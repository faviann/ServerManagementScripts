[project]
name = "server-management-scripts"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ansible-core>=2.20.4",
    "ansible-lint>=24.0.0",
    "jsonschema>=4.0",
    "yamllint>=1.32.0",
    "requests>=1.1",
    "proxmoxer>=2.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = ["pexpect>=4.9", "pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
