---
# Playbook to add control node SSH key to existing LXC containers
# This does NOT delete containers - it only adds the SSH public key to authorized_keys
#
# Usage:
#   uv run --locked ansible-playbook playbooks/add-ssh-keys-to-lxcs.yml
#   uv run --locked ansible-playbook playbooks/add-ssh-keys-to-lxcs.yml --limit portal

- name: Validate manual SSH recovery prerequisites
  ansible.builtin.import_playbook: proxmox-host-prerequisites.yml

- name: Add SSH keys to existing LXC containers via Proxmox host
  hosts: lxcs
  gather_facts: false

  pre_tasks:
    - name: Resolve control-node SSH public key
      ansible.builtin.include_role:
        name: infrastructure/ssh_key_shared
        tasks_from: resolve_pubkey
      vars:
        ssh_key_shared_explicit_path: "{{ proxmox_lxc_controller_pubkey_path | default('') }}"

    - name: Validate minimal manual SSH recovery identity
      ansible.builtin.assert:
        that:
          - proxmox_lxc_overrides is defined
          - proxmox_lxc_overrides.vmid is defined
          - proxmox_lxc_overrides.vmid | int > 0
          - proxmox_lxc_overrides.hostname is defined
          - proxmox_lxc_overrides.hostname | string | length > 0
        fail_msg: >-
          Manual SSH recovery requires vmid and hostname in proxmox_lxc_overrides
          for {{ inventory_hostname }}.

    - name: Build minimal manual SSH recovery input
      ansible.builtin.set_fact:
        proxmox_lxc_manual_guest_bootstrap:
          vmid: "{{ proxmox_lxc_overrides.vmid }}"
          hostname: "{{ proxmox_lxc_overrides.hostname }}"
          pubkey: "{{ ssh_key_shared_public_key_content }}"
      no_log: true

  roles:
    - role: infrastructure/lxc_ssh_key_injector
      vars:
        lxc_ssh_key_injector_guest_bootstrap: "{{ proxmox_lxc_manual_guest_bootstrap }}"

- name: Test SSH connectivity to updated containers
  hosts: lxcs
  gather_facts: false
  tags:
    - verify
    - ssh_test

  tasks:
    - name: Test SSH connection with new key
      ansible.builtin.ping:
      register: ping_result
      ignore_unreachable: true
      ignore_errors: true

    - name: Report SSH connectivity status
      ansible.builtin.debug:
        msg: "✓ SSH connection successful to {{ inventory_hostname }}"
      when: ping_result is succeeded and ping_result is not unreachable

    - name: Report SSH connectivity failure
      ansible.builtin.debug:
        msg: "✗ SSH connection failed to {{ inventory_hostname }} - manual intervention may be needed"
      when: ping_result is unreachable or ping_result is failed
