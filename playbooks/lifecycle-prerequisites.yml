---
- name: Verify control node has been bootstrapped
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    control_node_project_root: "{{ playbook_dir | dirname }}"
    control_node_uv_virtualenv: "{{ [playbook_dir | dirname, '.venv'] | path_join }}"
    control_node_collection_install_path: "{{ [playbook_dir | dirname, 'collections'] | path_join }}"
    control_node_collection_requirements: >-
      {{ [playbook_dir | dirname, 'collections', 'requirements.yml'] | path_join }}
  tags:
    - control_node_prerequisites
  tasks:
    - name: Require the serialized lifecycle wrapper
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'HOMELAB_IAC_LIFECYCLE_WRAPPER') == '1'
        fail_msg: >-
          Lifecycle runs must use ./run.sh so machine-local lifecycle mutation is serialized.
        quiet: true
      run_once: true

    - name: Check for uv-managed control node virtual environment
      ansible.builtin.stat:
        path: "{{ control_node_uv_virtualenv }}"
      register: control_node_virtualenv_stat
      run_once: true

    - name: Read required Ansible collection versions
      ansible.builtin.include_vars:
        file: "{{ control_node_collection_requirements }}"
        name: control_node_dependency_requirements
      run_once: true

    - name: Read installed Ansible collection manifests
      ansible.builtin.slurp:
        src: >-
          {{
            [
              control_node_collection_install_path,
              'ansible_collections',
              item.name | replace('.', '/'),
              'MANIFEST.json'
            ] | path_join
          }}
      loop: "{{ control_node_dependency_requirements.collections }}"
      register: control_node_collection_manifests
      failed_when: false
      run_once: true

    - name: Assert uv-managed control node virtual environment is present
      ansible.builtin.assert:
        that:
          - control_node_virtualenv_stat.stat.exists
        fail_msg: >-
          Bootstrap prerequisite {{ control_node_uv_virtualenv }} is missing. Run `uv sync --locked`.
      run_once: true

    - name: Assert installed Ansible collection versions match requirements
      ansible.builtin.assert:
        that:
          - control_node_installed_collection_version == item.item.version | string
        fail_msg: >-
          Ansible collection {{ item.item.name }} version drift:
          expected {{ item.item.version }}, installed {{ control_node_installed_collection_version }}.
          Run `uv run --locked ansible-playbook bootstrap.yml`.
        quiet: true
      vars:
        control_node_installed_collection_version: >-
          {{
            ((item.content | b64decode | from_json).collection_info.version | string)
            if item.content is defined
            else 'missing'
          }}
      loop: "{{ control_node_collection_manifests.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      run_once: true

    - name: Ensure Traefik-integrated Docker hosts define default_domain
      ansible.builtin.assert:
        that:
          - hostvars[item].default_domain is defined
          - hostvars[item].default_domain | string | length > 0
        fail_msg: >-
          Host '{{ item }}' has Traefik-integrated Docker agents enabled but is missing
          `default_domain` in inventory/host_vars/{{ item }}.yml. Define `default_domain`
          or explicitly set `traefik_kop_enabled: false` for opt-out hosts.
        quiet: true
      loop: "{{ groups['cap_docker'] | default([]) }}"
      when:
        - hostvars[item].docker_agents_enabled | default(true) | bool
        - hostvars[item].traefik_kop_enabled | default(true) | bool

- name: Bootstrap Proxmox host SSH access
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  roles:
    - role: infrastructure/proxmox_host_bootstrap
      proxmox_validate_api: false
